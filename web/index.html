<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/brand/icon-16.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#c7301d">
<meta name="application-name" content="bazifor.me">
<meta name="apple-mobile-web-app-title" content="bazifor.me">
<meta name="msapplication-TileColor" content="#c7301d">

<meta name="format-detection" content="telephone=no">
<title>FengShui Family Compass</title>
<link rel="stylesheet" href="/static/style.css">
<style>:root{--wood:#187a35;--fire:#c5221f;--earth:#8a6d1f;--metal:#8a6500;--water:#1a56b0}.el-wood{color:var(--wood)}.el-fire{color:var(--fire)}.el-earth{color:var(--earth)}.el-metal{color:var(--metal)}.el-water{color:var(--water)}.zh[data-tip]{cursor:help;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px;border-radius:2px}.zh[data-tip]:focus-visible{outline:2px solid #8a6d1f;outline-offset:2px}.gl-tip{position:fixed;z-index:9999;max-width:calc(100vw - 32px);width:max-content;background:#2b2620;color:#fff;font:500 14px/1.45 system-ui,sans-serif;padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(43,38,32,.25);opacity:0;transition:opacity .15s;pointer-events:none;text-align:left;white-space:normal}.gl-tip.on{opacity:1}@media (prefers-reduced-motion:reduce){.gl-tip{transition:none}}</style></head>
<body>
<header>
  <h1>FengShui Family Compass (<span class="zh" lang="zh-Hans" tabindex="0" title="luó pán" data-tip="luó pán">罗盘</span>)</h1>
  <div id="house-line"></div>
  <div class="controls">
    <label>Year <input id="year" type="number" value="2026" min="1990" max="2060"></label>
    <label>Period
      <select id="period"><option value="8" selected>Period 8 (八运)</option><option value="9">Period 9 (九运)</option></select>
    </label>
    <label>Sectors
      <select id="method"><option value="pie" selected>pie (米字)</option><option value="grid">grid (九宫)</option></select>
    </label>
    <label>Time
      <select id="policy"><option value="true_solar" selected>true solar</option><option value="clock">clock</option></select>
    </label>
    <a id="report-link" href="/report" target="_blank">📄 Email report</a>
    <a id="snapshot-link" href="/snapshot" target="_blank">🧭 Interactive snapshot</a>
    <a id="trace-link" href="/trace" target="_blank">✏️ Trace floorplan</a>
  </div>
  <nav>
    <button class="tab active" data-tab="forme">For Me</button>
    <button class="tab" data-tab="ourhome">Home</button>
    <button class="tab" data-tab="assign">Rooms</button>
    <button class="tab" data-tab="planner">Planner</button>
    <button class="tab" id="working-toggle">The Working ▾</button>
  </nav>
  <nav id="working-nav" hidden>
    <button class="tab" data-tab="family">Family</button>
    <button class="tab" data-tab="person">Reading</button>
    <button class="tab" data-tab="house">House</button>
    <button class="tab" data-tab="compare">Compare</button>
    <button class="tab" data-tab="forecast">Forecast</button>
    <button class="tab" data-tab="dates">Dates</button>
    <button class="tab" data-tab="pair">Pair</button>
    <button class="tab" data-tab="names">Names</button>
    <button class="tab" data-tab="unit">Unit</button>
  </nav>
  <div id="warnings"></div>
</header>
<main>
  <section id="tab-forme" class="tabpane active"></section>
  <section id="tab-ourhome" class="tabpane"></section>
  <section id="tab-compare" class="tabpane"></section>
  <section id="tab-planner" class="tabpane"></section>
  <section id="tab-family" class="tabpane"></section>
  <section id="tab-person" class="tabpane"><p class="hint">Pick a family member on the Family tab.</p></section>
  <section id="tab-house" class="tabpane"></section>
  <section id="tab-assign" class="tabpane"></section>
  <section id="tab-forecast" class="tabpane"></section>
  <section id="tab-dates" class="tabpane"></section>
  <section id="tab-pair" class="tabpane"></section>
  <section id="tab-names" class="tabpane"></section>
  <section id="tab-unit" class="tabpane"></section>
</main>
<script src="/static/glossary.js"></script>
<script src="/static/app.js"></script>

<script src="/static/glossary-tip.js" defer></script>
</body>
</html>
