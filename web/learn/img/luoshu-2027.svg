<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" aria-label="Luo Shu 3 by 3 grid with south at top, showing 2027 annual stars: 巽8 離4 坤6 / 震7 中9 兌2 / 艮3 坎5 乾1. The star 5 (五黃) sits in 坎, North." font-family="system-ui, 'Noto Sans SC', sans-serif">
<title>2027 丁未年 annual flying stars (from 立春 2027-02-04)</title>
<rect width="720" height="456" fill="#faf7f2"/>
<text x="360.0" y="30.0" font-size="18" fill="#2b2620" text-anchor="middle" font-weight="bold">2027 丁未年 annual flying stars (from 立春 2027-02-04)</text>
<rect x="135" y="54" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="147.0" y="80.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">巽 SE</text>
<text x="210.0" y="138.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">8</text>
<rect x="285" y="54" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="297.0" y="80.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">離 S</text>
<text x="360.0" y="138.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">4</text>
<rect x="435" y="54" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="447.0" y="80.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">坤 SW</text>
<text x="510.0" y="138.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">6</text>
<rect x="135" y="166" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="147.0" y="192.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">震 E</text>
<text x="210.0" y="250.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">7</text>
<rect x="285" y="166" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="297.0" y="192.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">中 centre</text>
<text x="360.0" y="250.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">9</text>
<rect x="435" y="166" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="447.0" y="192.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">兌 W</text>
<text x="510.0" y="250.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">2</text>
<rect x="135" y="278" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="147.0" y="304.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">艮 NE</text>
<text x="210.0" y="362.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">3</text>
<rect x="285" y="278" width="150" height="112" fill="#f3d9d5" stroke="#b03a2e" stroke-width="3"/>
<text x="297.0" y="304.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">坎 N</text>
<text x="360.0" y="362.0" font-size="50" fill="#b03a2e" text-anchor="middle" font-weight="bold">5</text>
<text x="425.0" y="304.0" font-size="16" fill="#b03a2e" text-anchor="end" font-weight="bold">五黃</text>
<rect x="435" y="278" width="150" height="112" fill="#fff" stroke="#2b2620" stroke-width="1.5"/>
<text x="447.0" y="304.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">乾 NW</text>
<text x="510.0" y="362.0" font-size="50" fill="#2b2620" text-anchor="middle" font-weight="bold">1</text>
<text x="360.0" y="416.0" font-size="14" fill="#2b2620" text-anchor="middle" font-weight="normal">South at top. Each cell: palace, compass direction, 2027 star.</text>
<text x="360.0" y="438.0" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="normal">5 (五黃, in 坎 North) is the star to keep quiet this year.</text>
</svg>
