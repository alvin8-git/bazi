<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-label="The ten gods for day master 己 in five groups: 比劫 (己 比肩, 戊 劫財), 食傷 (辛 食神, 庚 傷官), 財 (癸 偏財, 壬 正財), 官殺 (乙 七殺, 甲 正官), 印 (丁 偏印, 丙 正印). Sample chart shares: 劫財 48.1, 七殺 29.6, 正印 11.1, 偏財 7.4, 傷官 3.7 percent. Fictional example." font-family="system-ui, 'Noto Sans SC', sans-serif">
