<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-label="A room with eight compass positions. For kua 坎: 生氣 SE, 天醫 E, 延年 S, 伏位 N are favourable; 絕命 SW, 五鬼 NE, 六煞 NW, 禍害 W are unfavourable. A bed has its head toward SE." font-family="system-ui, 'Noto Sans SC', sans-serif">
<title>Eight Mansions: the eight positions of a room (example: kua 坎, East group)</title>
<rect width="720" height="465" fill="#faf7f2"/>
<rect x="215" y="112" width="290" height="220" fill="#fff" stroke="#2b2620" stroke-width="3"/>
<text x="360.0" y="86.0" font-size="16" fill="#2b2620" text-anchor="middle" font-weight="bold">N 坎</text>
<text x="360.0" y="106.0" font-size="16" fill="#8a6d1f" text-anchor="middle" font-weight="bold">伏位</text>
<text x="522.0" y="100.0" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold">NE 艮</text>
<text x="522.0" y="120.0" font-size="16" fill="#b03a2e" text-anchor="start" font-weight="bold">五鬼</text>
<text x="522.0" y="212.0" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold">E 震</text>
<text x="522.0" y="232.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">天醫</text>
<text x="522.0" y="340.0" font-size="16" fill="#2b2620" text-anchor="start" font-weight="bold">SE 巽</text>
<text x="522.0" y="360.0" font-size="16" fill="#8a6d1f" text-anchor="start" font-weight="bold">生氣</text>
<text x="360.0" y="372.0" font-size="16" fill="#2b2620" text-anchor="middle" font-weight="bold">S 離</text>
<text x="360.0" y="392.0" font-size="16" fill="#8a6d1f" text-anchor="middle" font-weight="bold">延年</text>
<text x="198.0" y="340.0" font-size="16" fill="#2b2620" text-anchor="end" font-weight="bold">SW 坤</text>
<text x="198.0" y="360.0" font-size="16" fill="#b03a2e" text-anchor="end" font-weight="bold">絕命</text>
<text x="198.0" y="212.0" font-size="16" fill="#2b2620" text-anchor="end" font-weight="bold">W 兌</text>
<text x="198.0" y="232.0" font-size="16" fill="#b03a2e" text-anchor="end" font-weight="bold">禍害</text>
<text x="198.0" y="100.0" font-size="16" fill="#2b2620" text-anchor="end" font-weight="bold">NW 乾</text>
<text x="198.0" y="120.0" font-size="16" fill="#b03a2e" text-anchor="end" font-weight="bold">六煞</text>
<g transform="translate(405,262) rotate(45)"><rect x="-40" y="-22" width="80" height="44" rx="5" fill="#eadfc2" stroke="#2b2620" stroke-width="2"/><rect x="18" y="-17" width="18" height="34" rx="5" fill="#fff" stroke="#2b2620" stroke-width="2"/></g>
<text x="300.0" y="200.0" font-size="14" fill="#2b2620" text-anchor="middle" font-weight="normal">Bed, head toward</text>
<text x="300.0" y="220.0" font-size="14" fill="#8a6d1f" text-anchor="middle" font-weight="bold">生氣 (SE 巽)</text>
<text x="360.0" y="410.0" font-size="14" fill="#2b2620" text-anchor="middle" font-weight="normal">North at top. Eight Mansions positions for the room.</text>
<circle cx="170" cy="440" r="7" fill="#8a6d1f"/><text x="184.0" y="445.0" font-size="14" fill="#2b2620" text-anchor="start" font-weight="normal">吉 favourable</text>
<circle cx="330" cy="440" r="7" fill="#b03a2e"/><text x="344.0" y="445.0" font-size="14" fill="#2b2620" text-anchor="start" font-weight="normal">凶 unfavourable</text>
<text x="470.0" y="445.0" font-size="14" fill="#2b2620" text-anchor="start" font-weight="normal">example: kua 坎, East group</text>
</svg>
