<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 718" role="img" aria-label="Left-to-right pipeline. Inputs: date, time, place, sex. Fixed rules: solar terms 節氣, stems and branches 干支, ten gods 十神, useful god 用神, eight mansions 八宅, flying stars 玄空. Outputs: chart, scores, dates. A bracket marks same inputs give same outputs. A second lane, interpretation (method notes), is the only judgement layer." font-family="system-ui, 'Noto Sans SC', sans-serif">
<title>Deterministic pipeline</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2620"/></marker>
