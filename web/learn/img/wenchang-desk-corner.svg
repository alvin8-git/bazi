<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 745" role="img" aria-label="Room plan with eight compass sectors around a centre. For the fictional sample, day stem 己 gives 文昌 branch 酉, which is the West 兌 sector, shaded gold. A desk sits in the West sector with its back to the solid west wall, facing east (arrow). The door is on the opposite east wall, in view and not behind the desk. Legend: desk in the 文昌 sector, back to a solid wall, door in view, not behind." font-family="system-ui, 'Noto Sans SC', sans-serif">
<title>Room plan: 文昌 desk corner</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2620"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs>
<rect width="1180" height="745" fill="#faf7f2"/>
