<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Your reading (命书) | bazifor.me</title>
<link rel="stylesheet" href="/static/style.css">
<style>
:root{--seal:#c7301d;--gold2:#8a6d1f;--serif:Georgia,"Noto Serif SC","Songti SC",serif}
body.reading-pub{background:#faf7f2;color:#2b2620;font-size:16px;line-height:1.55}
body.reading-pub a:focus-visible,body.reading-pub button:focus-visible,body.reading-pub summary:focus-visible{outline:3px solid #8a6d1f;outline-offset:2px}
.reading-pub .verbadge{z-index:20;top:auto;bottom:8px}
/* header band */
.reading-pub header.pub{position:relative;overflow:hidden;padding:0;border-bottom:1px solid var(--line);background:#f3ecdd}
.reading-pub .pub-band{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;display:block}
.reading-pub header.pub::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(90deg,rgba(250,247,242,.96) 0%,rgba(250,247,242,.9) 55%,rgba(250,247,242,.55) 100%)}
.reading-pub .pub-in{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:22px 16px 20px}
.reading-pub header.pub h1{margin:0 0 6px;font:700 32px/1.15 var(--serif);color:#2b2620;letter-spacing:-.01em}
.reading-pub header.pub h1 small{font:500 16px/1 var(--serif);color:#8a6d1f;letter-spacing:0;white-space:nowrap}
.reading-pub header.pub .hint{display:block;margin:0 0 14px;font-size:16px;color:#6b6359;max-width:46ch}
.reading-pub header.pub a#back{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;margin:0;
  background:#fff;color:#b03a2e;border:1px solid #e5ded2;border-radius:22px;font-size:15px;font-weight:600;text-decoration:none}
.reading-pub header.pub a#back:hover{border-color:#b03a2e}
.reading-pub main{padding:18px 16px 48px;max-width:1180px;margin:0 auto}
@media(max-width:720px){.reading-pub header.pub h1{font-size:26px}
  .reading-pub header.pub::before{background:rgba(250,247,242,.88)}}
/* app-rendered reading, scoped */
.reading-pub #tab-person{font-size:16px;line-height:1.55}
.reading-pub #tab-person .rd-synth-body h4{color:#6b6359;font-size:13px;letter-spacing:.06em}
.reading-pub #tab-person .rd-label{font-size:16px}
.reading-pub #tab-person details.deep,
.reading-pub #tab-person .explain,
.reading-pub #tab-person .rd-synth-note{border-radius:14px}
.reading-pub #tab-person .rd-synth-note{border-radius:0 14px 14px 0}

/* next steps */
.reading-pub .next{margin:36px 0 0;background:#fff;border:1px solid #e5ded2;border-radius:14px;padding:18px 20px}
.reading-pub .next-head{display:flex;align-items:center;gap:14px;margin:0 0 12px}
.reading-pub .next-head img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.reading-pub .next h2{margin:0;font:700 22px/1.25 var(--serif);color:#2b2620}
.reading-pub .next ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.reading-pub .next a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid #e5ded2;border-radius:22px;
  background:#faf7f2;color:#b03a2e;font-size:15px;font-weight:600;text-decoration:none}
.reading-pub .next a:hover{border-color:#b03a2e}
.reading-pub .next .lbl{font-size:13px;font-weight:700;color:#8a6d1f;margin:0 0 2px}
:root{--wood:#187a35;--fire:#c5221f;--earth:#7a601b;--metal:#8a6500;--water:#1a56b0}.el-wood{color:var(--wood)}.el-fire{color:var(--fire)}.el-earth{color:var(--earth)}.el-metal{color:var(--metal)}.el-water{color:var(--water)}.zh[data-tip]{cursor:help;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px;border-radius:2px}.zh[data-tip]:focus-visible{outline:2px solid #8a6d1f;outline-offset:2px}.gl-tip{position:fixed;z-index:9999;max-width:calc(100vw - 32px);width:max-content;background:#2b2620;color:#fff;font:500 14px/1.45 system-ui,sans-serif;padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(43,38,32,.25);opacity:0;transition:opacity .15s;pointer-events:none;text-align:left;white-space:normal}.gl-tip.on{opacity:1}@media (prefers-reduced-motion:reduce){.gl-tip{transition:none}}

/* the reading renders after its fetch; hold a screen of space so nothing below it jumps (CLS) */
#tab-person{min-height:100vh}
</style></head><body class="reading-pub">
<span class="verbadge" id="ver"></span>
<header class="pub">
  <img class="pub-band" src="/static/img/tools/reading-header-600.jpg"
    srcset="/static/img/tools/reading-header-600.jpg 600w, /static/img/tools/reading-header.jpg 1200w"
    sizes="100vw" width="1200" height="400" alt="Ink-and-paper illustration of a four-pillar chart on a writing desk" fetchpriority="high">
  <div class="pub-in">
    <h1>Your reading <small>(<span class="zh" lang="zh-Hans" tabindex="0" title="mìng shū · the reading" data-tip="mìng shū · the reading">命书</span>)</small></h1>
    <span class="hint">Every number and label here is engine output, and the rule behind it is cited beside it.</span>
    <a id="back" href="/start">&larr; Back to workspace</a>
  </div>
</header>
<main>
  <section id="tab-person" class="tabpane active"><p class="hint">computing…</p></section>
  <aside class="next" aria-labelledby="next-h">
    <div class="next-head">
      <img src="/static/img/tools/motif-next-600.jpg" width="48" height="48" alt="" loading="lazy">
      <div><p class="lbl">Next steps</p><h2 id="next-h">Keep going</h2></div>
    </div>
    <ul>
      <li><a href="/learn/day-masters-explained">Day Masters explained</a></li>
      <li><a href="/kua">Kua number calculator</a></li>
      <li><a href="/baby">Baby name builder</a></li>
    </ul>
  </aside>
</main>
<script>
  fetch("/api/pub/version").then(r => r.json())
    .then(v => { document.getElementById("ver").textContent = "v " + v.version; })
    .catch(() => {});
  const m = location.pathname.match(/^\/w\/([A-Za-z0-9_-]+)\/person\/(\d+)\/reading/);
  window.__PUBLIC_READING__ = m ? {
    chartUrl: `/api/pub/w/${m[1]}/person/${m[2]}/chart`,
    token: m[1], idx: +m[2],
    name: "",
  } : null;
  if (m) document.getElementById("back").href = `/w/${m[1]}`;
</script>
