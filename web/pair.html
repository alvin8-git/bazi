<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>合婚配对报告 Pair Compatibility Report — bazifor.me</title>
<style>
:root{--bg:#f6f2ea;--card:#fffdf7;--ink:#22242a;--muted:#8b8f9a;--line:#e4ddcc;
  --accent:#a63d2f;--gold:#8a6d00;--good:#1e7d32;--bad:#b03a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,"Noto Sans SC","PingFang SC",sans-serif}
.page{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.report{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;box-shadow:0 1px 8px rgba(60,50,20,.08)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:12px}
.rhead h1{margin:0;font-size:19px;color:var(--accent)}
.rhead h1 small{display:block;font-size:11px;color:var(--gold);font-weight:600}
.rmeta{text-align:right;font-size:10.5px;color:var(--muted)}
.idrow{display:flex;gap:10px;margin:10px 0}
.idchip{flex:1;background:#f8f5ec;border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:12.5px}
.idchip b{font-size:15px}
.idchip .sub{color:var(--muted);font-size:11px}
.idchip .gf{color:var(--gold);font-weight:700;font-size:10px}
.idchip{display:block;color:inherit;text-decoration:none;position:relative}
.idchip .idgo{color:var(--accent);font-weight:800;margin-left:4px}
a.idchip:hover{border-color:var(--accent)}
a.idchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vs{align-self:center;font-weight:800;color:var(--gold)}
h2{font-size:13px;color:var(--gold);margin:16px 0 6px;border-bottom:1px solid var(--line);
  padding-bottom:3px}
h2 small{color:var(--muted);font-weight:600;font-size:10px;margin-left:6px}
.be{display:block;color:var(--muted);font-size:9.5px;line-height:1.3}
.gauge{margin:6px 0 2px}
.ctable{width:100%;border-collapse:collapse;font-size:12px}
.ctable th{font-size:10px;color:var(--muted);text-align:left;font-weight:600;
  padding:2px 6px;border-bottom:1px solid var(--line)}
.ctable td{padding:4px 6px;border-bottom:1px solid #efe9da;vertical-align:middle}
.ctable td.pts{text-align:right;font-weight:800;width:40px;white-space:nowrap}
.ctable .pos{color:var(--good)}.ctable .neg{color:var(--bad)}.ctable .neu{color:var(--muted)}
.ctable .tot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none}
.rng{width:120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.dtable{width:100%;border-collapse:collapse;font-size:11.5px;margin:2px 0 6px}
.dtable th{font-size:10px;color:var(--muted);text-align:left;font-weight:600;
  padding:2px 6px;border-bottom:1px solid var(--line)}
.dtable td{padding:5px 6px;border-bottom:1px solid #efe9da;vertical-align:top}
.dtable td.nb{white-space:normal;font-weight:600}
.dtable .pos{color:var(--good)}.dtable .neg{color:var(--bad)}
.dtable .citer td{border-bottom:1px solid var(--line);padding:0 6px 4px;
  font-size:8px;color:var(--muted)}
.frame3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:560px){.frame3{grid-template-columns:1fr}}
.elb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;border:1.5px solid;font-size:10.5px;font-weight:700;margin:0 2px;
  vertical-align:-3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.elb.el-木{color:#1e8e3e;border-color:#1e8e3e;background:#e9f7ee}
.elb.el-火{color:#c5221f;border-color:#c5221f;background:#fdecea}
.elb.el-土{color:#8a6d1f;border-color:#8a6d1f;background:#f6efdc}
.elb.el-金{color:#a67c00;border-color:#c9a227;background:#faf3dd}
.elb.el-水{color:#1a56b0;border-color:#1a56b0;background:#e8f0fe}
.frame3 .pitem{border-left:4px solid var(--fb,#b8860b);
  background:var(--fbg,#faf3dd) !important;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.scorechip{display:inline-block;font-weight:800;font-size:11px;border-radius:7px;
  padding:0 7px;color:#fff;background:var(--fb,#b8860b);margin-left:5px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.cw{font-weight:700}
.cw-white{background:#fff;border:1px solid #d8d2c2;border-radius:4px;padding:0 3px;
 -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pitem{font-size:11.5px;margin:5px 0;padding:6px 9px;background:#f8f5ec;border-radius:8px;
  break-inside:avoid}
.pitem.warn{background:#fdf1ec}
.cite2{font-size:8.5px;color:var(--muted);margin-top:2px}
.frame3 .pitem{background:#f4f1ea}
details{margin:8px 0}summary{font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.toolbar{display:flex;gap:10px;margin:0 0 12px}
.toolbar a,.toolbar button{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;
  color:var(--accent);text-decoration:none}
.foot{font-size:9px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);
  padding-top:6px}
.prep{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0 6px;margin:8px 0 4px}
.prep-k{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--accent);margin-bottom:3px}.prep-k .be-in{font-weight:600;color:var(--muted);font-size:10.5px;margin-left:4px}
.prep-more{margin:2px 0 0}.prep-more>summary{color:var(--accent);font-size:12px}
.seetable td{vertical-align:top}.seetable th:nth-child(4),.seetable th:nth-child(5){min-width:120px}
.swtable{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0}
.swtable th{padding:4px 5px;text-align:center;border-bottom:1px solid var(--line);font-weight:600;vertical-align:top}
.swtable th b{display:block;font-size:17px;line-height:1.1}.swtable th small{display:block;font-size:9px;color:var(--muted);line-height:1.2}
.swtable th.corner{text-align:left;font-weight:500}.swtable th.corner small{font-size:10px}
.swtable td{text-align:center;padding:7px 4px;border-bottom:1px solid #efe9da;border-left:1px solid #efe9da;color:var(--muted)}
.swtable td b{display:block;font-size:13px}.swtable td i{display:block;font-style:normal;font-size:8.5px;color:var(--muted)}
.swtable td.sw-bond{background:#e6f2ef;color:#0e7a6a}.swtable td.sw-fric{background:#f9efe0;color:#b45309}.swtable td.sw-scored{outline:2px solid var(--gold);outline-offset:-2px}
.swlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--muted);margin:4px 0 6px}.swlegend .sw-bond{color:#0e7a6a;font-weight:700}.swlegend .sw-fric{color:#b45309;font-weight:700}
.frtable td{vertical-align:top;width:31%}.frtable td.nb{width:7%;white-space:nowrap}
h2 .scorechip{float:right;margin-top:-2px}
.prep-lede{margin:0 0 4px;font-size:13px;font-weight:600;line-height:1.5;color:var(--ink)}
.prep-body{font-size:12px;line-height:1.55;color:var(--ink)}.prep-body h4{margin:7px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--muted);text-transform:uppercase}
.prep-body p{margin:3px 0}.prep-body ul{margin:3px 0 0;padding-left:18px}.prep-body li{margin:2px 0}
.prep-conf{margin-top:6px!important;font-size:11px;color:var(--muted)}
.basis{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.basis.classical{color:#0c5c50;border-color:#bfdcd4;background:#e6f2ef}.basis.modern{color:#8a5410;border-color:#e7cfa8;background:#f9efe0}
@media print{
  .prep{padding:4px 0}.prep-lede{font-size:10.5px}.prep-body{font-size:9px}.prep-body h4{font-size:8.5px;margin:4px 0 1px}.prep-conf{font-size:8px}
  .basis{font-size:8px}
  body{background:#fff;font-size:9.5px;line-height:1.35}
  .page{max-width:none;padding:0}
  .report{border:none;box-shadow:none;border-radius:0;padding:0 1mm}
  .toolbar,details:not(.printable){display:none}
  details.printable>summary{display:none}
  .swtable{font-size:9px}.swtable th b{font-size:13px}.swtable td{padding:3px 2px}.swtable td b{font-size:10px}.seetable,.frtable{font-size:9px}
  .pitem{padding:2px 5px;margin:2px 0;background:#f6f3ec !important;border-radius:4px;
    font-size:9px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cite2{font-size:7px}.be{font-size:7.5px;line-height:1.2}
  h2{margin:5px 0 2px;font-size:10.5px;padding-bottom:1px}
  .rhead{padding-bottom:5px;margin-bottom:5px}.rhead h1{font-size:15px}
  .idrow{margin:5px 0}.idchip{padding:3px 8px;font-size:10px;background:#f8f5ec !important}
  .idchip b{font-size:12px}
  .ctable{font-size:9.5px}.ctable td{padding:1.5px 5px}
  .dtable{font-size:9px}.dtable td{padding:2px 4px}
  .dtable .citer td{font-size:6.5px;padding:0 4px 2px}
  .rng{width:90px}.gauge{max-height:38px}
  .two{gap:2px 10px}.frame3{gap:4px}
  .foot{margin-top:5px;padding-top:3px}
  @page{size:A4;margin:9mm}
}
</style></head><body>
<div class="page">
  <div class="toolbar"><a id="back" href="#">← 返回 workspace</a>
    <button onclick="print()">🖨 打印 Print</button></div>
  <div class="report" id="rep">loading…</div>
</div>
<script>
const m = location.pathname.match(/^\/w\/([^/]+)\/pair\/(\d+)\/(\d+)/);
const token = m && m[1], A = m && m[2], B = m && m[3];
document.getElementById("back").href = `/w/${token}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const be = (o) => `<small class="be">${esc(o.en)}</small>`;
const elb = (e) => e ? `<span class="elb el-${e}">${e}</span>` : "";
const STEM_EL = { 甲: "木", 乙: "木", 丙: "火", 丁: "火", 戊: "土", 己: "土",
  庚: "金", 辛: "金", 壬: "水", 癸: "水" };
const EL_COL = { 木: "#1e8e3e", 火: "#c5221f", 土: "#8a6d1f", 金: "#7d5c00", 水: "#1a56b0" };
const ZODIAC = { 鼠: ["🐭", "Rat"], 牛: ["🐮", "Ox"], 虎: ["🐯", "Tiger"], 兔: ["🐰", "Rabbit"],
  龙: ["🐲", "Dragon"], 蛇: ["🐍", "Snake"], 马: ["🐴", "Horse"], 羊: ["🐑", "Goat"],
  猴: ["🐵", "Monkey"], 鸡: ["🐔", "Rooster"], 狗: ["🐶", "Dog"], 猪: ["🐷", "Pig"],
  龍: ["🐲", "Dragon"], 馬: ["🐴", "Horse"], 雞: ["🐔", "Rooster"], 豬: ["🐷", "Pig"] };
const ELIMG = { 木: "wood", 火: "fire", 土: "earth", 金: "metal", 水: "water" };
const ELTH = { 木: "linear-gradient(160deg,rgba(243,249,239,.84),rgba(226,239,216,.8))",
  火: "linear-gradient(160deg,rgba(253,241,236,.84),rgba(249,222,212,.8))",
  土: "linear-gradient(160deg,rgba(250,244,230,.84),rgba(240,227,198,.8))",
  金: "linear-gradient(160deg,rgba(251,249,241,.84),rgba(244,236,212,.8))",
  水: "linear-gradient(160deg,rgba(239,245,250,.84),rgba(220,233,244,.8))" };
const elthBg = (el) => ELTH[el]
  ? `background:${ELTH[el]},url(/static/img/elements/${ELIMG[el]}.jpg) center/cover`
  : "";
const BAND_COL = (s) => s >= 70 ? ["#1e7d32", "#e9f7ee"] : s >= 55 ? ["#5f8a3e", "#eef3e3"]
  : s >= 45 ? ["#b8860b", "#faf3dd"] : ["#b03a2e", "#fdecea"];
const COLOUR_WORDS = { 红: "#c5221f", 紅: "#c5221f", 紫: "#7b3fa0", 黄: "#7d5800",
  黃: "#7d5800", 棕: "#8a5a2b", 绿: "#17702f", 綠: "#17702f", 青: "#17702f",
  蓝: "#1a56b0", 藍: "#1a56b0", 黑: "#22242a", 灰: "#4b5563", 金: "#7d5c00",
  白: "#4b5563" };                              // 白 = ink + chip, never white
const COLOUR_EN = { red: "#c5221f", purple: "#7b3fa0", yellow: "#7d5800",
  brown: "#8a5a2b", green: "#17702f", blue: "#1a56b0", black: "#22242a",
  grey: "#4b5563", gray: "#4b5563", white: "#4b5563" };
const CJK = "\u4e00-\u9fff";
function colorizeColoursRep(root) {             // standalone colour words only
  const zhRe = new RegExp(`(?<![${CJK}])([红紅紫黄黃棕绿綠青蓝藍黑灰白金])(?![${CJK}])`, "g");
  const enRe = new RegExp(`\\b(${Object.keys(COLOUR_EN).join("|")})\\b`, "gi");
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement
      && !n.parentElement.closest("script,style,svg,.elb,.tcol,.nocolor")
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  let t; while ((t = w.nextNode())) {
    zhRe.lastIndex = 0; enRe.lastIndex = 0;
    if (zhRe.test(t.nodeValue) || enRe.test(t.nodeValue)) nodes.push(t);
  }
  for (const node of nodes) {
    const s = node.nodeValue, frag = document.createDocumentFragment(), hits = [];
    zhRe.lastIndex = 0; enRe.lastIndex = 0;
    let m;
    while ((m = zhRe.exec(s))) hits.push([m.index, m[0], COLOUR_WORDS[m[0]]]);
    while ((m = enRe.exec(s))) hits.push([m.index, m[0], COLOUR_EN[m[0].toLowerCase()]]);
    hits.sort((a, b) => a[0] - b[0]);
    let last = 0;
    for (const [idx, txt, col] of hits) {
      if (idx < last) continue;
      frag.appendChild(document.createTextNode(s.slice(last, idx)));
      const b = document.createElement("b");
      b.className = "cw" + (/^(白|white)$/i.test(txt) ? " cw-white" : "");
      b.style.color = col; b.textContent = txt;
      frag.appendChild(b); last = idx + txt.length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

const BR_EL = { 子: "水", 丑: "土", 寅: "木", 卯: "木", 辰: "土", 巳: "火", 午: "火", 未: "土", 申: "金", 酉: "金", 戌: "土", 亥: "水" };
const GODS_RE = "比肩|劫財|劫财|食神|傷官|伤官|正財|正财|偏財|偏财|正官|七殺|七杀|正印|偏印";
function colorizeRep(root) {                    // element, stem, branch and ten-god mentions in running text
  const re = new RegExp(`(${GODS_RE})|([甲乙丙丁戊己庚辛壬癸])(?=[子丑寅卯辰巳午未申酉戌亥])|(?<![甲乙丙丁戊己庚辛壬癸])([子丑寅卯辰巳午未申酉戌亥])(?![年月日时柱支平女])|(木|火(?!车|車)|土(?!豆)|金(?!额|額)|水(?!平|准|準))|\\b(Wood|Fire|Earth|Metal|Water)\\b`, "g");
  const EN2EL = { Wood: "木", Fire: "火", Earth: "土", Metal: "金", Water: "水" };
  const nodes = [];
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement
      && !n.parentElement.closest("script,style,svg,.elb,.nocolor,.idchip,.swtable th")
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  let t; while ((t = w.nextNode())) { re.lastIndex = 0; if (re.test(t.nodeValue)) nodes.push(t); }
  for (const node of nodes) {
    const s = node.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(s))) {
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const b = document.createElement("b");
      b.className = "tcol";
      b.style.color = m[1] ? "var(--gold)" : m[2] ? EL_COL[STEM_EL[m[2]]] : m[3] ? EL_COL[BR_EL[m[3]]] : (EL_COL[EN2EL[m[0]] || m[0]] || "");
      b.textContent = m[0];
      frag.appendChild(b);
      last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

function gauge(score) {                       // band zones + marker, inline SVG
  const x = 20 + (score / 100) * 320;
  const zone = (a, b, c) => `<rect x="${20 + a * 3.2}" y="22" width="${(b - a) * 3.2}" height="10" fill="${c}"/>`;
  return `<svg viewBox="0 0 360 52" class="gauge" role="img" aria-label="score ${score} of 100">
    ${zone(0, 45, "#f3d8cf")}${zone(45, 55, "#efe6cf")}${zone(55, 70, "#e3e8cf")}${zone(70, 100, "#cfe3cf")}
    <text x="21" y="18" font-size="8" fill="#8b8f9a">0 需磨合</text>
    <text x="164" y="18" font-size="8" fill="#8b8f9a">45 中</text>
    <text x="196" y="46" font-size="8" fill="#8b8f9a">55 中上</text>
    <text x="244" y="18" font-size="8" fill="#8b8f9a">70 上等</text>
    <text x="340" y="18" font-size="8" fill="#8b8f9a" text-anchor="end">100</text>
    <line x1="${x}" y1="18" x2="${x}" y2="36" stroke="#a63d2f" stroke-width="2"/>
    <circle cx="${x}" cy="27" r="6" fill="#a63d2f"/>
    <text x="${x}" y="30" font-size="7" fill="#fff" text-anchor="middle" font-weight="700">${score}</text>
  </svg>`;
}
function rangeBar(delta) {                    // zero-axis reference-range strip
  const MAX = 15, w = Math.min(Math.abs(delta), MAX) / MAX * 55;
  const bar = delta > 0 ? `<rect x="60" y="4" width="${w}" height="8" rx="2" fill="#1e7d32"/>`
    : delta < 0 ? `<rect x="${60 - w}" y="4" width="${w}" height="8" rx="2" fill="#b03a2e"/>`
    : `<circle cx="60" cy="8" r="3" fill="#b9b4a6"/>`;
  return `<svg viewBox="0 0 120 16" class="rng" role="img" aria-label="${delta} points">
    <line x1="60" y1="1" x2="60" y2="15" stroke="#d8d2c2" stroke-width="1"/>
    <line x1="4" y1="8" x2="116" y2="8" stroke="#eee8d9" stroke-width="1"/>${bar}</svg>`;
}

(async () => {
  const rep = document.getElementById("rep");
  try {
    const [d, ws] = await Promise.all([
      fetch(`/api/pub/w/${token}/pair?a=${A}&b=${B}`).then((r) => { if (!r.ok) throw Error(r.status); return r.json(); }),
      fetch(`/api/pub/w/${token}`).then((r) => r.json()),
    ]);
    const pa = ws.people[A] || {}, pb = ws.people[B] || {};
    const idc = (p, n, idx) => { const fav = STEM_EL[p.day_master];
      const z = ZODIAC[p.animal] || ["", p.animal || "—"];
      return `<a class="idchip" href="/w/${token}/person/${idx}/reading"
        title="打开命书 open this reading" style="${elthBg(fav)}"><b>${esc(n)}</b><span class="idgo">›</span>
      <div class="sub"><span class="gf">日主</span> ${p.day_master || "—"}${elb(STEM_EL[p.day_master])} ·
        <span class="gf">生肖</span> ${z[0]} ${z[1]} ·
        <span class="gf">强弱</span> ${esc(p.strength || "")}</div></a>`; };
    const cls = (dl) => dl > 0 ? "pos" : dl < 0 ? "neg" : "neu";
    const rows = d.arithmetic.map((r) => `<tr>
      <td>${esc(r.label.zh)}${be(r.label)}</td>
      <td>${rangeBar(r.delta)}</td>
      <td class="pts ${cls(r.delta)}">${r.delta > 0 ? "+" : ""}${r.delta}</td></tr>`).join("");
    // 相互看对方 as a 2-row table
    const seeTable = `<table class="dtable seetable">
      <tr><th>视角 view</th><th>十神 god</th><th>经典 classical</th><th>家 at home</th><th>职 at work</th></tr>
      ${[[`${d.a} → ${d.b}`, d.relation.a_sees_b], [`${d.b} → ${d.a}`, d.relation.b_sees_a]]
        .map(([who, r]) => `<tr><td class="nb">${esc(who)}</td>
          <td class="nb"><b style="color:${EL_COL[r.element] || "inherit"}">${r.god}</b>${elb(r.element)}</td>
          <td>${esc(r.zh)}${be(r)}</td>
          <td>${r.modern_home ? esc(r.modern_home.zh) + be(r.modern_home) : "—"}</td>
          <td>${r.modern_work ? esc(r.modern_work.zh) + be(r.modern_work) : "—"}</td></tr>`).join("")}</table>
      <div class="cite2">经典一栏为十神互看（子平法）；家/职两栏为现代读法（MODERN SYNTHESIS）· classical column = the ten-god relation; home/work = modern readings</div>`;
    // strengths + frictions merged: one factor-detail table in component order
    const lmap = {};                            // ledger label → element (for badges)
    d.arithmetic.forEach((r) => { if (r.element) lmap[r.label.zh] = r.element; });
    const fbadge = (lbl) => elb(lmap[lbl.zh]);
    const rowsS = d.strengths.map((s) => ({
      cite: s.source_ref,
      f: `<b class="pos">+${s.delta}</b> ${fbadge(s.chip_label)}${esc(s.chip_label.zh)}${be(s.chip_label)}`,
      why: `${esc(s.explanation.zh)}${be(s.explanation)}`,
      how: s.action ? `✓ ${esc(s.action.zh)}<small class="be">${esc(s.action.en)}</small>`
                    : `✓ ${esc(s.explanation.zh.split("——").pop())}`,
    }));
    const rowsF = d.frictions.map((f) => ({
      cite: f.source_ref,
      f: `<b class="neg">${f.delta}</b> ${fbadge(f.chip_label)}${esc(f.chip_label.zh)}${be(f.chip_label)}`,
      why: `${esc(f.element.why.zh)}（${esc(f.mechanism)}）${be(f.element.why)}`,
      how: `<div>五行: ${elb(f.element.zh.length === 1 ? f.element.zh : "")}<b>${esc(f.element.zh)}</b>${f.element.colour_material ? " — " + esc(f.element.colour_material) : ""}${f.element.direction ? " · " + esc(f.element.direction) : ""}
              <small class="be">${esc(f.element.why.en)}</small></div>
            <div>策略: ${esc(f.behaviour.zh)}<small class="be">${esc(f.behaviour.en)}</small></div>
            <div>时机: ${esc(f.timing.zh)}<small class="be">${esc(f.timing.en)}</small></div>`,
    }));
    const factorRows = [...rowsS, ...rowsF];
    const factorTable = factorRows.length ? `<table class="dtable">
      <tr><th style="width:26%">因素 factor</th><th style="width:34%">原因 reason</th><th>对策 action</th></tr>
      ${factorRows.map((r) => `<tr><td class="nb">${r.f}</td><td>${r.why}</td><td>${r.how}</td></tr>
        <tr class="citer"><td colspan="3">${esc(r.cite)}</td></tr>`).join("")}</table>`
      : `<div class="pitem">此配对无已计分的相合或摩擦项——参考四柱互动与十神互看。
         <small class="be">no scored bonds or frictions — see the pillar sweep and mutual reading</small></div>`;
    const PZ = { year: ["年柱", "elders & roots"], month: ["月柱", "career & parents"], day: ["日柱", "self & spouse"], hour: ["时柱", "children & later"] };
    const bcol = (e) => EL_COL[e] || "inherit";
    const sweep = d.sweep_matrix ? `<table class="swtable">
      <tr><th class="corner"><small>${esc(d.a)} ↓ · ${esc(d.b)} →</small></th>${d.sweep_matrix[0].map((c) =>
        `<th><b style="color:${bcol(c.element_b)}">${c.branch_b}</b><small>${PZ[c.pillar_b][0]}<br>${PZ[c.pillar_b][1]}</small></th>`).join("")}</tr>
      ${d.sweep_matrix.map((row) => `<tr><th><b style="color:${bcol(row[0].element_a)}">${row[0].branch_a}</b><small>${PZ[row[0].pillar_a][0]}<br>${PZ[row[0].pillar_a][1]}</small></th>
        ${row.map((c) => `<td class="${c.relation ? (c.bond ? "sw-bond" : "sw-fric") : "sw-none"}${c.scored ? " sw-scored" : ""}">${c.relation ? `<b>${c.relation}</b>${c.scored ? `<i>已计分</i>` : ""}` : "·"}</td>`).join("")}</tr>`).join("")}</table>
      <div class="swlegend"><span class="sw-bond">六合 · 半三合 bond</span><span class="sw-fric">六沖 · 刑 · 六害 friction</span><span class="sw-none">· none</span><span>已计分 = counted in the score (day-day, year-year)</span></div>
      ${d.sweep_reading ? `<div class="pitem">${esc(d.sweep_reading.zh)}<small class="be">${esc(d.sweep_reading.en)}</small></div>` : ""}` : "";
    rep.innerHTML = `
      <div class="rhead"><h1>合婚配对报告<small>Pair Compatibility Report · bazifor.me</small></h1>
        <div class="rmeta">${new Date().toISOString().slice(0, 10)}<span id="verline"></span><br>deterministic · every number cites its rule</div></div>
      <div class="idrow">${idc(pa, d.a, A)}<div class="vs">✕</div>${idc(pb, d.b, B)}</div>
      ${d.report ? (() => { const [fb] = BAND_COL(d.score);
        const lede = esc(d.report.summary).replace(/^(\d+\/100\s*—\s*[^.]+\.)/, (m0) => `<span style="color:${fb}">${m0}</span>`);
        return `<div class="prep"><div class="prep-k">綜合論斷 <span class="be-in">The Synthesis — the geomancer's pair report</span></div>
        <p class="prep-lede">${lede}</p>
        <details class="prep-more printable"><summary>read the full report ›</summary>
        <div class="prep-body"><h4>Findings</h4>${d.report.findings.map((f) => `<p><b>${esc(f.label)}.</b> ${esc(f.text)}</p>`).join("")}
          <h4>Assessment</h4><p>${esc(d.report.assessment)}</p>
          <h4>Plan</h4><ul>${d.report.plan.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          <p class="prep-conf">${esc(d.report.confidence)}</p></div></details></div>`; })() : ""}
      <h2>总评 <small>overall reading</small></h2>
      ${gauge(d.score)}
      ${(() => { const [fb] = BAND_COL(d.score);
        return `<div style="font-size:12.5px"><b style="color:${fb}">${d.score}/100 · ${esc(d.band.zh)}</b>
          <small class="be" style="color:${fb}">${esc(d.band.en)}</small></div>`; })()}
      <h2>成分明细 <small>component table — each factor against its reference range</small></h2>
      <table class="ctable"><tr><th>因素 factor</th><th>范围 range (−15 ⟵ 0 ⟶ +15)</th><th>分 pts</th></tr>
        <tr><td>基础分 <small class="be">baseline</small></td><td>${rangeBar(0)}</td><td class="pts neu">50</td></tr>
        ${rows}
        <tr class="tot"><td>总分（5–95 区间）<small class="be">total, clamped</small></td><td></td>
          <td class="pts">${d.score}</td></tr></table>
      ${d.modern && d.modern.rows && d.modern.rows.length ? `<h2>现代解读 <small>modern reading — classical principles on the two readings, own ledger</small></h2>
      <table class="ctable"><tr><th>层 layer</th><th>依据 basis</th><th>分 pts</th></tr>
        ${d.modern.rows.map((r) => `<tr><td>${esc(r.label.zh)}${be(r.label)}${r.note ? `<small class="be">${esc(r.note)}</small>` : ""}</td>
          <td><span class="basis ${r.basis}">${r.basis === "classical" ? "classical 经典" : "modern 现代"}</span></td>
          <td class="pts ${cls(r.delta)}">${r.delta > 0 ? "+" : ""}${r.delta}</td></tr>`).join("")}
        <tr class="tot"><td>含现代层的读数（不改动经典总分）<small class="be">reading with the modern layers — the classical score above is unchanged</small></td><td></td>
          <td class="pts">${d.modern.score_with_modern}</td></tr></table>
      <div class="cite2">${esc(d.modern.source_ref)}</div>` : ""}
      <h2>相互看对方 <small>how they see each other</small></h2>
      ${seeTable}
      <details class="printable"><summary>因素详解 factor detail — reason &amp; action per scored factor ›</summary>${factorTable}</details>
      <h2>四柱互动 <small>pillar interactions — every branch of one chart against every branch of the other</small></h2>
      ${sweep}
      <h2>三种关系视角 <small>the same pair, three framings</small>
        ${(() => { const [fb] = BAND_COL(d.score); return `<span class="scorechip" style="--fb:${fb}">${d.score} · ${esc(d.band.zh)} ${esc(d.band.en)}</span>`; })()}</h2>
      ${(() => {
        const F = d.framings_table; if (!F) return "";
        const cellf = (o) => `${esc(o.zh)}${be(o)}`;
        return `<table class="dtable frtable">
          <tr><th></th><th>家人 Family</th><th>夫妻 Couple</th><th>同事 Colleagues</th></tr>
          ${[["含义 meaning", "meaning"], ["可倚 lean on", "lean_on"], ["留意 watch", "watch"]].map(([lab, k]) =>
            `<tr><td class="nb">${lab}</td><td>${cellf(F.family[k])}</td><td>${cellf(F.couple[k])}</td><td>${cellf(F.colleagues[k])}</td></tr>`).join("")}</table>
        <div class="cite2">三个视角共用同一总分；可倚/留意各取该情境下最相关的已计分或现代层因素 · one frozen score; lean-on / watch pick the factor most relevant to each context</div>`;
      })()}
      <div class="foot">${esc(d.source_ref)} · 明细相加与主表分数完全一致 the component table sums exactly to
        the harmony-matrix score · bazifor.me/w/${esc(token).slice(0, 3)}····</div>`;
    colorizeRep(rep);
    colorizeColoursRep(rep);
    const pd = () => Array.from(rep.querySelectorAll("details.printable"));
    let wasOpen = [];
    window.addEventListener("beforeprint", () => { wasOpen = pd().map((x) => x.open); pd().forEach((x) => (x.open = true)); });
    window.addEventListener("afterprint", () => pd().forEach((x, i) => (x.open = !!wasOpen[i])));
    fetch("/api/pub/version", {cache: "no-store"}).then((r) => r.json())
      .then((v) => { const el = document.getElementById("verline");
        if (el && v && v.version) el.textContent = ` · v ${v.version}`; })
      .catch(() => {});
  } catch (e) { rep.innerHTML = `<b>could not load this pair</b> — ${esc(e.message)}`; }
})();
</script></body></html>
