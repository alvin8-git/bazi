":"明面上的十神，若其五行也出现在地支里，就是有根（持久）；只在明面上就是浮（社交场合显眼，需要靠山）","appjs.LEGENDS.4.08.term":"组合格局","appjs.LEGENDS.4.08.gloss":"经典组合（食神制七杀、伤官见正官……），看的是十神合在一起的表现，而不只是各自的大小","appjs.LEGENDS.5.01.term":"用神（喜用）","appjs.LEGENDS.5.01.gloss":"喜用：用来调和命盘的五行；可在颜色、方位和行业上多取这些五行","appjs.LEGENDS.5.02.term":"忌","appjs.LEGENDS.5.02.gloss":"会加重失衡的五行","appjs.LEGENDS.5.03.term":"扶抑法","appjs.LEGENDS.5.03.gloss":"扶弱抑强：选出用神所用的方法","appjs.LEGENDS.5.04.term":"调候","appjs.LEGENDS.5.04.gloss":"按季节寒暖做的核对（冬天出生的命盘，往往无论如何都需要火）","appjs.LEGENDS.6.01.gloss":"每十年一柱，从月柱起排","appjs.LEGENDS.6.02.term":"年龄","appjs.LEGENDS.6.02.gloss":"你在这一柱运下的年龄段","appjs.LEGENDS.6.03.term":"十神标签","appjs.LEGENDS.6.03.gloss":"这十年的主要主题，沿用第4节的说法","appjs.LEGENDS.6.04.term":"高亮","appjs.LEGENDS.6.04.gloss":"你当前所在的这十年","appjs.LEGENDS.7.01.term":"八宅","appjs.LEGENDS.7.01.gloss":"八宅派：你的命卦把罗盘分成4个宜用的方位（绿）和4个宜避的方位（红）","appjs.LEGENDS.7.02.term":"怎么用","appjs.LEGENDS.7.02.gloss":"绿色方位用于床头、书桌朝向和大门；红色方位放储物间或卫生间都可以","appjs.LEGENDS.7.03.term":"因人而异","appjs.LEGENDS.7.03.gloss":"这张方位图每个人不一样，夫妻两人的图可能正好相反","appjs.LEGENDS.8.01.term":"得分","appjs.LEGENDS.8.01.gloss":"从中性的50分起步，每个标签都是一条改变了分数的规则","appjs.LEGENDS.8.02.gloss":"天生的强项","appjs.LEGENDS.8.03.gloss":"值得有意识去支持的方面","appjs.LEGENDS.8.04.term":"标签","appjs.LEGENDS.8.04.gloss":"推演依据：这几项没有悬停说明，它们本身就是推演过程","appjs.LEGENDS.8.05.term":"坐实","appjs.LEGENDS.8.05.gloss":"该领域的关键十神确实坐在它的主宫位里，所以比单看占比更有分量","appjs.LEGENDS.8.06.term":"财库","appjs.LEGENDS.8.06.gloss":"财星五行所入的库支（辰、戌、丑、未）：库已开，财会越积越多；库封着，要等逢冲之年才打开（见第13节）；无库，财来财去，要靠固定的储蓄机制来存","appjs.LEGENDS.9.01.gloss":"神煞：经典的天干地支组合，是命盘结构之上的点缀","appjs.LEGENDS.9.02.term":"年柱/月柱/日柱/时柱标记","appjs.LEGENDS.9.02.gloss":"落在哪一柱：祖上·事业与父母·自己与配偶·子女与晚年","appjs.LEGENDS.10.01.term":"维度","appjs.LEGENDS.10.01.gloss":"直接取自第4节的分布，“依据”一列写着确切的阈值","appjs.LEGENDS.10.02.term":"倾向不明显","appjs.LEGENDS.10.02.gloss":"这也是正常的结果，不是没算出来","appjs.LEGENDS.11.01.term":"五行↔脏腑","appjs.LEGENDS.11.01.gloss":"传统五行医学的对应关系，仅供参考，不是医疗建议","appjs.LEGENDS.11.02.term":"状态","appjs.LEGENDS.11.02.gloss":"标出偏少或偏多、靠不住的五行","appjs.LEGENDS.12
